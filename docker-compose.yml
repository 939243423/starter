services:
  backend:
    build: ./backend
    container_name: starter-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: starter-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
